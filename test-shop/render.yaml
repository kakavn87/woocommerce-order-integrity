services:
  - type: web
    name: oi-test-shop
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./test-shop/Dockerfile
    dockerContext: .
    envVars:
      - key: WORDPRESS_DB_HOST
        value: 127.0.0.1:3306
      - key: WORDPRESS_DB_NAME
        value: wordpress
      - key: WORDPRESS_DB_USER
        value: wordpress
      - key: WORDPRESS_DB_PASSWORD
        value: test-password
      - key: WORDPRESS_CONFIG_EXTRA
        value: "require_once ABSPATH . 'wp-config-extra.php';"
    healthCheckPath: /
