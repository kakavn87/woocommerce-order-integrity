services:
  - type: web
    name: oi-test-shop
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./test-shop/Dockerfile
    dockerContext: .
    envVars:
      - key: WORDPRESS_DB_HOST
        fromService:
          type: pserv
          name: oi-test-mysql
          property: host
      - key: WORDPRESS_DB_NAME
        value: wordpress
      - key: WORDPRESS_DB_USER
        value: wordpress
      - key: WORDPRESS_DB_PASSWORD
        fromService:
          type: pserv
          name: oi-test-mysql
          envVarKey: MYSQL_PASSWORD
      - key: WORDPRESS_CONFIG_EXTRA
        value: "require_once ABSPATH . 'wp-config-extra.php';"
    healthCheckPath: /
  - type: pserv
    name: oi-test-mysql
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./test-shop/mysql/Dockerfile
    dockerContext: .
    envVars:
      - key: MYSQL_DATABASE
        value: wordpress
      - key: MYSQL_USER
        value: wordpress
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
